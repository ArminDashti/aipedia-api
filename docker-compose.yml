services:
  postgres:
    image: postgres:16-alpine
    container_name: aipedia-postgres
    environment:
      POSTGRES_USER: aipedia
      POSTGRES_PASSWORD: aipedia
      POSTGRES_DB: aipedia
    ports:
      - "5433:5432"
    volumes:
      - aipedia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipedia -d aipedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aipedia_pgdata:
